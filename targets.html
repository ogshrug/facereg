<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Management - Face Recognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <a href="index.html" class="back-btn">← Back</a>
            <div class="header-titles">
                <h1>Face Recognition</h1>
                <p>Real-time face detection powered by InsightFace</p>
            </div>
        </div>
    </header>

    <div id="app">
        <main class="container single-column">
            <div class="target-management-page card">
                <h3 class="label">Target Management</h3>
                <div id="drop-zone" class="drop-zone">
                    <p>Drag & Drop image here or</p>
                    <button id="upload-btn-trigger">Choose File</button>
                    <input type="file" id="target-upload-input" accept="image/*" hidden>
                </div>
                <div id="target-gallery" class="target-gallery">
                    <!-- Target thumbnails will be added here -->
                </div>
            </div>
        </main>
    </div>

    <script src="utils.js"></script>
    <script src="targets.js"></script>
</body>
</html>
